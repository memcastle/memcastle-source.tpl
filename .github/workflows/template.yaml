name: Validate standalone source template

on: [push, pull_request]

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install released GitTPL 0.14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.14.0 --repo noirbizarre/git-tpl --pattern 'git-tpl_0.14.0_linux-amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/git-tpl_0.14.0_linux-amd64.tar.gz" -C "$RUNNER_TEMP" ./git-tpl
      - name: Check standalone and nested module rendering
        run: |
          "$RUNNER_TEMP/git-tpl" test
      - name: Build a standalone source component
        run: |
          "$RUNNER_TEMP/git-tpl" render . -o "$RUNNER_TEMP/standalone-source" --answer module_name=standalone-source --defaults
          cargo build --manifest-path "$RUNNER_TEMP/standalone-source/Cargo.toml" --target wasm32-wasip2 --release
          test -f "$RUNNER_TEMP/standalone-source/target/wasm32-wasip2/release/standalone_source.wasm"
